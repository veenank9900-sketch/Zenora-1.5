<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My AI Chat</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#17222d;--mute:#6b7885;--line:#d9dfe5;--me:#0e5a5a;--me-ink:#fff;--code:#17222d;--code-ink:#e7eef5}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e7edf2;--mute:#8a98a5;--line:#2a3640;--me:#2a8a85;--code:#0b1015}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
select,button,textarea,input{font:inherit;color:inherit}
select,.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:18px 14px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{max-width:100%;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--me);color:var(--me-ink);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap}
.msg.bot p{margin:0 0 .7em}
.msg.bot pre{background:var(--code);color:var(--code-ink);padding:12px;border-radius:8px;overflow-x:auto;font-size:14px}
.msg.bot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.msg.bot :not(pre)>code{background:var(--line);padding:1px 5px;border-radius:4px}
.msg.err{color:#c0392b}
.empty{text-align:center;color:var(--mute);margin-top:18vh}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
form{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:160px;padding:6px 8px}
#send{background:var(--me);color:var(--me-ink);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
#send:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--me);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:420px;width:90%}
dialog input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:transparent;margin:8px 0}
dialog a{color:var(--me)}
</style>
</head>
<body>
<header>
  <h1>My AI Chat</h1>
  <select id="model" aria-label="Model">
    <option value="gemini-1.5-flash">Flash (fast)</option>
    <option value="gemini-1.5-pro">Pro (smarter)</option>
  </select>
  <button class="ghost" id="clear">New chat</button>
  <button class="ghost" id="key">API key</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<form id="form">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<dialog id="dlg">
  <form method="dialog">
    <b>Gemini API key</b>
    <p style="margin:6px 0;color:var(--mute);font-size:14px">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It is saved only in this browser.</p>
    <input id="keyInput" type="password" placeholder="Paste key here" autocomplete="off">
    <button class="ghost" value="ok">Save key</button>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), chat = $('chat'), input = $('input'), send = $('send');
let history = [];      // {role:'user'|'model', parts:[{text}]}
let busy = false;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let apiKey = store.get('gemini_key') || '';
$('model').value = store.get('gemini_model') || 'gemini-2.5-flash';
$('model').onchange = e => store.set('gemini_model', e.target.value);

// Minimal, safe markdown: code blocks, inline code, bold, paragraphs
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function md(text){
  const parts = text.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){ return '<pre><code>'+esc(p.replace(/^[\w+-]*\n/,''))+'</code></pre>' }
    return esc(p).split(/\n{2,}/).filter(x=>x.trim()).map(x=>
      '<p>'+x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>'
    ).join('');
  }).join('');
}

function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if(role==='bot') d.innerHTML = md(text); else d.textContent = text;
  log.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function renderEmpty(){
  log.innerHTML = '<div class="empty"><h2>How can I help?</h2>Ask a question, write code, or get an explanation.' +
  '<div class="chips"><button>Explain photosynthesis simply</button><button>Write a Python quiz game</button><button>Help me plan my study week</button></div></div>';
  log.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ input.value=b.textContent; $('form').requestSubmit() });
}

async function ask(text){
  if(!apiKey){ $('dlg').showModal(); return }
  if(busy) return;
  busy = true; send.disabled = true;
  const empty = log.querySelector('.empty'); if(empty) empty.remove();

  addMsg('user', text);
  history.push({role:'user', parts:[{text}]});
  const out = addMsg('bot', '…');
  let full = '';

  try{
    const model = $('model').value;
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`,
      { method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
        body: JSON.stringify({
          systemInstruction:{parts:[{text:'You are a helpful, friendly assistant. Answer clearly. Reply in the same language the user writes in.'}]},
          contents: history
        }) }
    );
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      throw new Error((j.error && j.error.message) || ('Request failed ('+res.status+')'));
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        try{
          const j = JSON.parse(line.slice(5));
          const t = (j.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('');
          if(t){ full += t; out.innerHTML = md(full); chat.scrollTop = chat.scrollHeight }
        }catch(e){}
      }
    }
    if(!full) throw new Error('Empty reply. Try rephrasing your question.');
    history.push({role:'model', parts:[{text:full}]});
  }catch(e){
    history.pop(); // drop the failed user turn so history stays valid
    out.className = 'msg bot err';
    out.textContent = 'Error: ' + e.message + (/key|API_KEY/i.test(e.message) ? ' — check your API key.' : '');
  }
  busy = false; send.disabled = false; input.focus();
}

$('form').onsubmit = e => {
  e.preventDefault();
  const t = input.value.trim();
  if(!t) return;
  input.value = ''; input.style.height = 'auto';
  ask(t);
};
input.addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches){ e.preventDefault(); $('form').requestSubmit() }
});
input.addEventListener('input', () => { input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,160)+'px' });

$('clear').onclick = () => { history = []; renderEmpty() };
$('key').onclick = () => { $('keyInput').value = apiKey; $('dlg').showModal() };
$('dlg').addEventListener('close', () => {
  const k = $('keyInput').value.trim();
  if(k){ apiKey = k; store.set('gemini_key', k) }
});

renderEmpty();
</script>
</body>
</html>
